name: GLaDOS Check-in

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
      - 'log.log'
  schedule:
    - cron: '18 9,12 * * *'
      timezone: 'Asia/Shanghai'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: write
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        # 排队运行时取分支最新状态，包含前一轮提交的日志
        ref: ${{ github.ref }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 执行 签到脚本
    - name: Running checkin
      id: checkin
      shell: bash
      run: |
        python -u checkin.py 2>&1 | tee log.log
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    # 即使签到失败，也提交本次日志；取消运行或非分支引用时不推送
    - name: Commit checkin log
      if: ${{ !cancelled() && steps.checkin.outcome != 'skipped' && github.ref_type == 'branch' }}
      shell: bash
      run: |
        if [ ! -f log.log ]; then
          exit 0
        fi
        # Actions 的控制台掩码不会写入文件，提交前再次脱敏
        python - <<'PY'
        import os
        from pathlib import Path
        from logging_config import redact

        path = Path("log.log")
        text = redact(path.read_text(encoding="utf-8"))
        for name in ("GLADOS_COOKIES", "PUSHDEER_SENDKEY", "SERVERCHAN_SENDKEY"):
            value = (os.environ.get(name) or "").strip()
            if value:
                text = text.replace(value, "[REDACTED]")
        path.write_text(text, encoding="utf-8")
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- log.log
        if git diff --cached --quiet -- log.log; then
          exit 0
        fi
        git commit -m "chore: update check-in log [skip ci]"
        git pull --rebase origin "$GITHUB_REF_NAME"
        git push origin "HEAD:$GITHUB_REF_NAME"
      env:
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

    # 签到失败（配置错误会 exit 1）时也要保活，否则恰好错过最需要提醒的那次
    - name: Keep alive
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: ${{ !cancelled() }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
